[project]
name = "danbyte-outpost"
version = "0.4.0"
description = "Remote monitoring agent for Danbyte — runs checks at a site with no direct path to the core and reports back over outbound HTTPS (or is driven in over SSH)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",     # outbound API (pull work / push results)
    "icmplib>=3.0",    # icmp
    "pysnmp>=6.2",     # snmp
    "asyncssh>=2.14",  # ssh
]

[project.scripts]
danbyte-outpost = "outpost.run:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
build = ["pyinstaller>=6.0"]  # single-file binary — see scripts/build-binary.sh

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The agent (outpost) + the vendored, Django-free check engine (danbyte_checks),
# which is the SAME code the Danbyte core runs. Keep it synced — see
# scripts/sync-checks.sh and docs/COMPATIBILITY.md.
packages = ["outpost", "danbyte_checks"]
